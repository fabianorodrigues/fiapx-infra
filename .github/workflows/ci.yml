name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: Validate Infra
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Environment info
        shell: pwsh
        run: |
          $PSVersionTable
          docker version
          docker compose version

      - name: Validate infrastructure
        shell: pwsh
        run: ./.github/scripts/validate-infra.ps1

  deploy:
    name: Deploy Infra
    needs: ci
    runs-on: [self-hosted, Windows, X64, fiap-fase5]
    timeout-minutes: 45
    if: ${{ needs.ci.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    env:
      DEPLOY_INFRA_PATH: ${{ vars.DEPLOY_INFRA_PATH }}
      BOOTSTRAP_VIDEO_MANAGEMENT_IMAGE: ${{ vars.BOOTSTRAP_VIDEO_MANAGEMENT_IMAGE }}
      BOOTSTRAP_VIDEO_PROCESSING_IMAGE: ${{ vars.BOOTSTRAP_VIDEO_PROCESSING_IMAGE }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Runner environment info
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $PSVersionTable
          docker version
          docker compose version
          docker ps

      - name: Deploy Infra
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: .\.github\scripts\deploy-infra.ps1
